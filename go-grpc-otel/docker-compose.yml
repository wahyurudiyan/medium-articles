services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"    # Jaeger UI
      - "14268:14268"    # HTTP collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - otel-demo

  profile-service:
    build:
      context: .
      dockerfile: Dockerfile.profile
    ports:
      - "9091:9091"
    depends_on:
      - jaeger
    environment:
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    networks:
      - otel-demo

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "9090:9090"
    depends_on:
      - jaeger
      - profile-service
    environment:
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - PROFILE_SERVICE_URL=profile-service:9091
    networks:
      - otel-demo

networks:
  otel-demo:
    driver: bridge
